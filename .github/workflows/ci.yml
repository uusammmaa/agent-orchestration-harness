name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U harness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The Postgres contract tests are the ones that matter, so CI always runs them.
      - run: npm test
        env:
          HARNESS_TEST_POSTGRES: "1"
          DATABASE_URL: postgres://harness:harness@localhost:5432/harness

  build:
    name: images and console build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @harness/console
      - run: docker build -f Dockerfile -t harness-api .
      - run: docker build -f Dockerfile.console -t harness-console .
